
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 문서 열람</title>

  <style>
    body {
      margin: 0;
      background: #525659;
      font-family: Arial, sans-serif;
    }

    #viewer {
      max-width: 900px;
      margin: 0 auto;
      padding: 12px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      margin-bottom: 12px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    #msg {
      color: white;
      text-align: center;
      padding: 35px 15px;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>
  <div id="msg">PDF를 불러오는 중...</div>
  <div id="viewer"></div>

    <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    // URL의 ?file= 뒤에 있는 PDF 파일명을 사용
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");

    const msg = document.getElementById("msg");
    const viewer = document.getElementById("viewer");

    if (!file || !file.toLowerCase().endsWith(".pdf") ||
        file.includes("/") || file.includes("\\")) {
      msg.textContent = "올바른 PDF 파일명이 지정되지 않았습니다.";
    } else {
      pdfjsLib.getDocument("./" + encodeURIComponent(file)).promise
        .then(async pdf => {
          msg.textContent = `총 ${pdf.numPages}페이지 불러오는 중...`;

               for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const viewport = page.getViewport({ scale: 1.5 });

            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = viewport.width;
            canvas.height = viewport.height;

            viewer.appendChild(canvas);

            await page.render({
              canvasContext: ctx,
              viewport: viewport
            }).promise;
          }

          msg.style.display = "none";
        })
        .catch(err => {
          msg.textContent = "PDF 열람 오류: " + err.message;
        });
    }
  </script>
</body>
</html>
